<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEDxYola Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-3xl font-bold text-center text-red-600 mb-8">TEDxYola Sign Up</h2>
        <form method="POST" action="/signup" class="space-y-6">
            <div>
                <label for="username" class="block text-gray-700">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>
            <div>
                <label for="email" class="block text-gray-700">Email</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>
            <div>
                <label for="password" class="block text-gray-700">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>
            <button type="submit" class="w-full py-2 px-4 bg-red-600 text-white rounded hover:bg-red-700 font-semibold">Sign Up</button>
        </form>
        <div class="my-4 flex items-center justify-center">
            <span class="text-gray-400">or</span>
        </div>
        <a href="{{ url_for('auth.googleLogin') }}" class="w-full flex items-center justify-center py-2 px-4 border border-gray-300 rounded bg-white hover:bg-gray-50 font-semibold">
            <img src="{{ url_for('static', filename='images/googleIcon.png') }}" alt="Google Icon" class="w-5 h-5 mr-2"> Sign up with Google
        </a>
        <div class="text-center mt-6">
            <span class="text-gray-600">Already have an account?</span>
            <a href="{{ url_for('auth.login') }}" class="text-red-600 hover:underline font-semibold">Login</a>
        </div>
    </div>
</body>
</html>
</body>
</html>
